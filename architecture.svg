<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mutual Fund Portfolio Intelligence System architecture</title>
<desc>A five-stage linear pipeline: input request, deterministic analytics engine, deterministic prioritizer, LLM reasoning layer with fallback, hallucination validator, then structured output.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="780" fill="#FFFFFF"/>

<g>
<rect x="140" y="40" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">AnalysisRequest</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">investor profile + portfolio holdings</text>
</g>
<line x1="340" y1="96" x2="340" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="156" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">1. engine.py — deterministic</text>
<text x="340" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">allocation, concentration, overlap, risk, performance</text>
</g>
<line x1="340" y1="212" x2="340" y2="266" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="272" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="292" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">2. prioritizer.py — deterministic</text>
<text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">rule-based severity scoring and ranking</text>
</g>
<line x1="340" y1="328" x2="340" y2="382" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="388" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="408" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">3. llm_reasoner.py — LLM or fallback</text>
<text x="340" y="426" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">explains, personalizes, selects top candidates</text>
</g>
<line x1="340" y1="444" x2="340" y2="498" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="504" width="400" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="524" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">4. validator.py — deterministic guard</text>
<text x="340" y="542" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">every number checked against evidence</text>
</g>
<line x1="340" y1="560" x2="340" y2="614" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="620" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="640" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">AnalysisResponse</text>
<text x="340" y="658" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">headline, ranked insights, data quality notes</text>
</g>

<rect x="40" y="700" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="64" y="712" font-family="sans-serif" font-size="12" fill="#5F5E5A">deterministic (code)</text>
<rect x="240" y="700" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="264" y="712" font-family="sans-serif" font-size="12" fill="#5F5E5A">LLM (with fallback)</text>
<rect x="440" y="700" width="16" height="16" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="464" y="712" font-family="sans-serif" font-size="12" fill="#5F5E5A">safety guard</text>
</svg>
